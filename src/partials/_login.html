<!-- LOGIN CONTAINER -->
<div class="login-container" id="loginContainer">
    <h1>🍽️ Food Tracker</h1>
    <div class="subtitle">Sign in to access your meals</div>
    
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com">
    </div>
    
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    
    <button class="btn btn-primary" id="signInBtn">Sign In</button>
    
    <div class="divider">or</div>
    
    <div class="form-group">
        <center>New here?</center>
    </div>
    <button class="btn btn-outline" id="signUpBtn">Create Account</button>
</div>
