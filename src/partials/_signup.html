<!-- SIGN-UP CONTAINER (hidden by default) -->
<div class="signup-container" id="signupContainer">
    <h1>🍽️ Create Account</h1>
    <div class="subtitle">Join Food Tracker</div>
    
    <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="signupName" placeholder="e.g., John Doe">
    </div>
    
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="your@email.com">
    </div>
    
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••">
        <small>Min. 6 characters</small>
    </div>
    
    <div class="form-group">
        <label>Height (cm)</label>
        <input type="number" id="signupHeight" placeholder="e.g., 175">
    </div>
    
    <div class="form-group">
        <label>Goal Weight (kg)</label>
        <input type="number" id="signupGoalWeight" placeholder="e.g., 85" step="0.1">
    </div>
    
    <div class="form-group">
        <label>Daily Protein Goal (g)</label>
        <input type="number" id="signupProteinGoal" placeholder="e.g., 140">
    </div>
    
    <button class="btn btn-primary" id="createAccountBtn">Create Account</button>
    <button class="btn btn-outline" id="backToLoginBtn">← Back to Login</button>
    
    <div class="demo-note" style="margin-top: 1rem;">
        Already have an account? <a href="#" id="backToLoginLink">Sign in</a>
    </div>
</div>
